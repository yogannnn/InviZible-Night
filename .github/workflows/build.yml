name: Nightly Build

on:
  push:
    branches: [ night ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Merge upstream
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/Gedsh/InviZible.git || true
          git fetch upstream
          UPSTREAM_BRANCH=$(git remote show upstream | grep 'HEAD branch' | cut -d' ' -f5)
          echo "Upstream default branch: $UPSTREAM_BRANCH"
          if git merge upstream/$UPSTREAM_BRANCH --no-edit -m "Auto-merge upstream ($UPSTREAM_BRANCH) into night"; then
            echo "✅ Merge successful"
          else
            echo "::error::Merge conflict with upstream. Resolve locally: git pull, fix conflicts, git push."
            exit 1
          fi

      - name: Get version
        id: meta
        run: |
          BASE_VERSION=$(grep -oP 'versionName "\K[^"]+' tordnscrypt/build.gradle | head -1)
          VERSION="${BASE_VERSION}-Night"
          DATE=$(date +'%Y%m%d')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "base_version=$BASE_VERSION" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "Base version: $BASE_VERSION → Release version: $VERSION, date: $DATE"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Restore Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > tordnscrypt/release-key.jks

      - name: Build Release APK
        env:
          CI: true
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleFdroidUniversalRelease

      - name: Rename APK
        run: |
          cd tordnscrypt/build/outputs/apk/fdroidUniversal/release/
          for f in *.apk; do
            mv "$f" "InviZible-Night-v${{ steps.meta.outputs.version }}-build${{ github.run_number }}.apk"
          done
          ls -la

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: tordnscrypt/build/outputs/apk/fdroidUniversal/release/*.apk
          tag_name: v${{ steps.meta.outputs.version }}.${{ steps.meta.outputs.date }}.${{ github.run_number }}-${{ github.run_attempt }}
          name: InviZible Night v${{ steps.meta.outputs.version }} — ${{ steps.meta.outputs.date }} (build ${{ github.run_number }}.${{ github.run_attempt }})
          draft: false
          prerelease: true
          overwrite: true
          body: |
            Automated nightly build of **InviZible Night**.
            
            - **Base version** (from upstream): ${{ steps.meta.outputs.base_version }}
            - **Release version**: ${{ steps.meta.outputs.version }}
            - **Date**: ${{ steps.meta.outputs.date }}
            - **Build**: #${{ github.run_number }} (attempt ${{ github.run_attempt }})
            - **Commit**: ${{ github.sha }}
            
            Based on upstream [InviZible Pro](https://github.com/Gedsh/InviZible) by Gedsh.
            
            **Install**: This APK installs alongside the official InviZible Pro (different application ID).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}